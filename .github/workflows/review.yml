# The public copy's own workflow. It runs the review path of this copy and nothing else:
# nine offline suites and the worked example, on stand-in providers, with no secret.
# It does not run the release's full chain of suites or its browser checks; those run in the private working repository.
name: review path
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-path:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.lock.txt
      - run: sh review.sh
